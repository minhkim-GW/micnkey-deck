name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          NAME="MicnKey-Deck-${GITHUB_REF_NAME}"
          mkdir -p "build/$NAME"
          rsync -a --exclude .git --exclude .github --exclude build ./ "build/$NAME/"
          cd build && zip -qr "../$NAME.zip" "$NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MicnKey-Deck-${GITHUB_REF_NAME}.zip" \
            --title "MicnKey Deck ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
